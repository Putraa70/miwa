<!DOCTYPE html><html lang="id"> <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Safira</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Inter:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/miwa/_astro/cerita-kita.sEfS6Nbs.css"></head> <body class="relative min-h-screen overflow-x-hidden"> <!-- Star background, always behind! --> <div class="fixed inset-0 pointer-events-none z-0"> <canvas id="stars-bg" class="w-full h-full"></canvas> </div> <!-- Main content always above stars --> <main class="relative z-10">  <!-- Star effect - always behind content, no pointer event, z-[-10] --><div class="fixed inset-0 pointer-events-none z-[-10]"> <canvas id="stars-bg" class="w-full h-full"></canvas> </div> <script>
  const canvas = document.getElementById("stars-bg");
  if (canvas) {
    const ctx = canvas.getContext("2d");
    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener("resize", resize);
    function drawStars() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < 70; i++) {
        const x = Math.random() * canvas.width;
        const y = Math.random() * canvas.height;
        const r = Math.random() * 1.2 + 0.3;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2, false);
        ctx.fillStyle = "rgba(255,255,255,0.8)";
        ctx.fill();
      }
    }
    setInterval(drawStars, 1200);
    drawStars();
  }
</script> <section class="max-w-2xl mx-auto py-14 relative z-10"> <h2 class="text-2xl font-bold mb-8 text-center text-red-500">
